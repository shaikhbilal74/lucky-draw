<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Registration Form - Lucky Draw</title>

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ================================= -->
    <!-- UPLOAD PAGE UI -->
    <!-- ================================= -->

    <style>

        /* ================================= */
        /* UPLOAD PAGE LAYOUT */
        /* ================================= */

        .upload-page {
            min-height: calc(100vh - 80px);

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 55px 20px 70px;

            box-sizing: border-box;
        }


        .upload-card {
            width: 100%;

            max-width: 700px;

            background: #ffffff;

            border-radius: 22px;

            padding: 38px;

            box-sizing: border-box;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.08);
        }


        /* ================================= */
        /* HEADER */
        /* ================================= */

        .upload-header {
            text-align: center;

            margin-bottom: 28px;
        }


        .upload-header-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 16px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #fff1f4,
                    #fff7ec
                );
        }


        .upload-header h1 {
            margin: 0 0 10px;

            font-size: 32px;

            line-height: 1.2;

            color: #111827;
        }


        .upload-header p {
            margin: 0 auto;

            max-width: 570px;

            font-size: 16px;

            line-height: 1.6;

            color: #64748b;
        }


        /* ================================= */
        /* PHOTO UPLOAD BOX */
        /* ================================= */

        .compact-upload {
            width: 100%;

            min-height: 105px;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            gap: 16px;

            padding: 18px 20px;

            border: 2px dashed #ff6b81;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #fff8f9,
                    #fffaf7
                );

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .compact-upload:hover {
            border-color: #ff4776;

            background:
                linear-gradient(
                    135deg,
                    #fff5f7,
                    #fff8f2
                );
        }


        .compact-upload:active {
            transform: scale(0.995);
        }


        /* ================================= */
        /* UPLOAD ICON */
        /* ================================= */

        .compact-upload-icon {
            width: 54px;
            height: 54px;

            min-width: 54px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background: #fff0f5;

            font-size: 27px;
        }


        /* ================================= */
        /* UPLOAD TEXT */
        /* ================================= */

        .compact-upload-main {
            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 4px;
        }


        .compact-upload-main strong {
            font-size: 17px;

            color: #111827;
        }


        .compact-upload-main span {
            font-size: 14px;

            color: #64748b;
        }


        /* ================================= */
        /* SELECTED FILE NAME */
        /* ================================= */

        .selected-file-name {
            max-width: 130px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 13px;

            color: #334155;

            text-align: right;
        }


        /* ================================= */
        /* REAL FILE INPUT */
        /* ================================= */

        #registrationImage {
            position: absolute;

            width: 1px;

            height: 1px;

            padding: 0;

            margin: -1px;

            overflow: hidden;

            clip: rect(0, 0, 0, 0);

            clip-path: inset(50%);

            white-space: nowrap;

            border: 0;

            opacity: 0;
        }


        /* ================================= */
        /* OCR STATUS */
        /* ================================= */

        .ocr-status {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 18px;

            padding: 16px 18px;

            border-radius: 14px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;
        }


        .ocr-status-icon {
            width: 34px;
            height: 34px;

            min-width: 34px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            color: #1d4ed8;

            font-size: 17px;

            font-weight: 700;
        }


        .ocr-status strong {
            display: block;

            margin-bottom: 3px;

            font-size: 16px;

            color: #111827;
        }


        .ocr-status p {
            margin: 0;

            font-size: 13px;

            line-height: 1.45;

            color: #64748b;
        }


        /* ================================= */
        /* OCR SUCCESS */
        /* ================================= */

        .ocr-status.ocr-success {
            background: #f0fdf4;

            border-color: #bbf7d0;
        }


        .ocr-status.ocr-success
        .ocr-status-icon {
            background: #dcfce7;

            color: #15803d;
        }


        /* ================================= */
        /* OCR WARNING */
        /* ================================= */

        .ocr-status.ocr-warning {
            background: #fffbeb;

            border-color: #fde68a;
        }


        .ocr-status.ocr-warning
        .ocr-status-icon {
            background: #fef3c7;

            color: #b45309;
        }


        /* ================================= */
        /* CONTINUE BUTTON */
        /* ================================= */

        #continueButton {
            width: 100%;

            min-height: 52px;

            margin-top: 20px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #ff3d71,
                    #ff7a00
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        #continueButton:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(255, 61, 113, 0.22);
        }


        /* ================================= */
        /* BACK BUTTON */
        /* ================================= */

        .back-btn {
            width: 100%;

            min-height: 52px;

            margin-top: 10px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f46e5
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .back-btn:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.20);
        }


        /* ================================= */
        /* TABLET / MOBILE */
        /* ================================= */

        @media (max-width: 700px) {

            .upload-page {
                min-height: calc(100vh - 70px);

                padding: 28px 14px 50px;
            }


            .upload-card {
                max-width: 100%;

                padding: 26px 20px;

                border-radius: 19px;
            }


            .upload-header {
                margin-bottom: 22px;
            }


            .upload-header-icon {
                width: 56px;
                height: 56px;

                margin-bottom: 13px;

                font-size: 28px;

                border-radius: 15px;
            }


            .upload-header h1 {
                font-size: 26px;

                line-height: 1.25;
            }


            .upload-header p {
                font-size: 14px;

                line-height: 1.5;
            }


            .compact-upload {
                min-height: 92px;

                padding: 14px;

                gap: 12px;

                border-radius: 14px;
            }


            .compact-upload-icon {
                width: 46px;
                height: 46px;

                min-width: 46px;

                border-radius: 12px;

                font-size: 23px;
            }


            .compact-upload-main strong {
                font-size: 15px;
            }


            .compact-upload-main span {
                font-size: 12px;
            }


            .selected-file-name {
                max-width: 105px;

                font-size: 12px;
            }


            .ocr-status {
                padding: 14px;

                margin-top: 14px;

                gap: 10px;
            }


            .ocr-status-icon {
                width: 29px;
                height: 29px;

                min-width: 29px;

                font-size: 15px;
            }


            .ocr-status strong {
                font-size: 14px;
            }


            .ocr-status p {
                font-size: 12px;
            }


            #continueButton {
                min-height: 50px;

                margin-top: 18px;

                font-size: 15px;
            }


            .back-btn {
                min-height: 48px;

                margin-top: 10px;

                font-size: 14px;
            }

        }


        /* ================================= */
        /* VERY SMALL PHONES */
        /* ================================= */

        @media (max-width: 400px) {

            .upload-page {
                padding: 18px 9px 40px;
            }


            .upload-card {
                padding: 20px 14px;

                border-radius: 16px;
            }


            .upload-header h1 {
                font-size: 24px;
            }


            .upload-header p {
                font-size: 13px;
            }


            .compact-upload {
                min-height: 80px;

                padding: 10px;

                gap: 9px;
            }


            .compact-upload-icon {
                width: 40px;
                height: 40px;

                min-width: 40px;

                font-size: 20px;
            }


            .compact-upload-main strong {
                font-size: 13px;
            }


            .compact-upload-main span {
                font-size: 11px;
            }


            .selected-file-name {
                max-width: 75px;

                font-size: 10px;
            }


            .ocr-status {
                padding: 12px;

                gap: 9px;
            }


            .ocr-status strong {
                font-size: 13px;
            }


            .ocr-status p {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================= -->
    <!-- NAVBAR -->
    <!-- ================================= -->

    <nav class="navbar">

        <div class="logo">

            🎉 <span>Lucky</span>Draw

        </div>


        <div class="participant-label">

            Registration

        </div>

    </nav>



    <!-- ================================= -->
    <!-- UPLOAD PAGE -->
    <!-- ================================= -->

    <section class="upload-page">

        <div class="upload-card">


            <!-- ================================= -->
            <!-- HEADER -->
            <!-- ================================= -->

            <div class="upload-header">

                <div
                    class="upload-header-icon"
                    aria-hidden="true"
                >
                    📄
                </div>


                <h1>
                    Upload Registration Form
                </h1>


                <p>
                    Upload a photo of your completed
                    registration form and we'll
                    automatically read your details.
                </p>

            </div>



            <!-- ================================= -->
            <!-- PHOTO UPLOAD -->
            <!-- ================================= -->

            <label
                for="registrationImage"
                class="compact-upload"
                id="photoUploadButton"
            >

                <div
                    class="compact-upload-icon"
                    aria-hidden="true"
                >
                    ☁️
                </div>


                <div class="compact-upload-main">

                    <strong>
                        Choose Photo
                    </strong>


                    <span>
                        JPG, PNG or other image
                    </span>

                </div>


                <div
                    id="selectedFileName"
                    class="selected-file-name"
                >
                    No file selected
                </div>

            </label>



            <!-- ================================= -->
            <!-- REAL FILE INPUT -->
            <!-- ================================= -->

            <input
                type="file"
                id="registrationImage"
                name="registrationImage"
                accept="image/*"
            >



            <!-- ================================= -->
            <!-- OCR STATUS -->
            <!-- ================================= -->

            <div
                id="ocrStatus"
                class="ocr-status"
                style="display: none;"
            >

                <div
                    id="ocrStatusIcon"
                    class="ocr-status-icon"
                >
                    ✓
                </div>


                <div>

                    <strong
                        id="ocrStatusTitle"
                    >
                        Reading form...
                    </strong>


                    <p
                        id="ocrStatusText"
                    >
                        Please wait while we read
                        your registration form.
                    </p>

                </div>

            </div>



            <!-- ================================= -->
            <!-- CONTINUE BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                id="continueButton"
                style="display: none;"
            >
                Review Your Details
            </button>



            <!-- ================================= -->
            <!-- BACK BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                onclick="window.location.href='index.html'"
                class="back-btn"
            >
                ← Back to Registration
            </button>

        </div>

    </section>



    <!-- ================================= -->
    <!-- SUPABASE -->
    <!-- ================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- ================================= -->
    <!-- UPLOAD / OCR JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const SUPABASE_URL =
            "https://mvwaanrbqjozxbncogzf.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_-jVZOnMljZt3VqDkwHCf_g_o8GDU_6c";


        const OCR_FUNCTION_URL =
            `${SUPABASE_URL}/functions/v1/read-registration-form`;



        // ============================================
        // ELEMENTS
        // ============================================

        const registrationImage =
            document.getElementById(
                "registrationImage"
            );


        const selectedFileName =
            document.getElementById(
                "selectedFileName"
            );


        const ocrStatus =
            document.getElementById(
                "ocrStatus"
            );


        const ocrStatusIcon =
            document.getElementById(
                "ocrStatusIcon"
            );


        const ocrStatusTitle =
            document.getElementById(
                "ocrStatusTitle"
            );


        const ocrStatusText =
            document.getElementById(
                "ocrStatusText"
            );


        const continueButton =
            document.getElementById(
                "continueButton"
            );



        // ============================================
        // OCR STATUS
        // ============================================

        function showOCRStatus(
            icon,
            title,
            message,
            statusClass = ""
        ) {

            if (!ocrStatus) {
                return;
            }


            ocrStatus.style.display =
                "flex";


            ocrStatus.className =
                "ocr-status";


            if (statusClass) {

                ocrStatus.classList.add(
                    statusClass
                );

            }


            if (ocrStatusIcon) {

                ocrStatusIcon.innerText =
                    icon;

            }


            if (ocrStatusTitle) {

                ocrStatusTitle.innerText =
                    title;

            }


            if (ocrStatusText) {

                ocrStatusText.innerText =
                    message;

            }

        }



        // ============================================
        // FILE → BASE64
        // ============================================

        function fileToBase64(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();


                    reader.onload = function () {

                        resolve(
                            reader.result
                        );

                    };


                    reader.onerror = function () {

                        reject(
                            new Error(
                                "Unable to read image file."
                            )
                        );

                    };


                    reader.readAsDataURL(file);

                }
            );

        }



        // ============================================
        // FILL FORM FROM OCR
        // ============================================

        function fillForm(data) {

            let fieldsFound = 0;


            // ----------------------------------------
            // NAME
            // ----------------------------------------

            if (
                data.name &&
                typeof data.name === "string"
            ) {

                const nameElement =
                    document.getElementById(
                        "name"
                    );


                if (nameElement) {

                    nameElement.value =
                        data.name.trim();

                    fieldsFound++;

                }

            }


            // ----------------------------------------
            // PHONE
            // ----------------------------------------

            if (
                data.phone &&
                typeof data.phone === "string"
            ) {

                const phoneElement =
                    document.getElementById(
                        "phone"
                    );


                if (phoneElement) {

                    const cleanPhone =
                        data.phone.replace(
                            /\D/g,
                            ""
                        );


                    phoneElement.value =
                        cleanPhone;

                    fieldsFound++;

                }

            }


            // ----------------------------------------
            // AREA
            // ----------------------------------------

            if (
                data.area &&
                typeof data.area === "string"
            ) {

                const areaElement =
                    document.getElementById(
                        "area"
                    );


                if (areaElement) {

                    areaElement.value =
                        data.area.trim();

                    fieldsFound++;

                }

            }


            // ----------------------------------------
            // CITY
            // ----------------------------------------

            if (
                data.city &&
                typeof data.city === "string"
            ) {

                const citySelect =
                    document.getElementById(
                        "city"
                    );


                if (citySelect) {

                    const city =
                        data.city
                            .trim()
                            .toLowerCase();


                    const matchingOption =
                        Array.from(
                            citySelect.options
                        ).find(
                            option =>
                                option.value
                                    .trim()
                                    .toLowerCase() ===
                                city
                        );


                    if (matchingOption) {

                        citySelect.value =
                            matchingOption.value;

                        fieldsFound++;

                    }

                }

            }


            return fieldsFound;

        }



        // ============================================
        // OCR / REGISTRATION PHOTO READER
        // ============================================

        async function readRegistrationForm(
            file
        ) {

            try {

                showOCRStatus(
                    "⏳",
                    "Reading your form...",
                    "Please wait while we read the registration details.",
                    "ocr-loading"
                );


                if (continueButton) {

                    continueButton.style.display =
                        "none";

                }


                // ------------------------------------
                // BASIC FILE CHECK
                // ------------------------------------

                const allowedTypes = [
                    "image/jpeg",
                    "image/jpg",
                    "image/png",
                    "image/webp"
                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    throw new Error(
                        "Please upload a JPG, PNG, or WebP image."
                    );

                }


                // ------------------------------------
                // MAXIMUM FILE SIZE
                // ------------------------------------

                const MAX_FILE_SIZE =
                    10 * 1024 * 1024;


                if (
                    file.size >
                    MAX_FILE_SIZE
                ) {

                    throw new Error(
                        "Image is too large. Maximum size is 10 MB."
                    );

                }


                // ------------------------------------
                // CONVERT IMAGE
                // ------------------------------------

                const imageBase64 =
                    await fileToBase64(
                        file
                    );


                console.log(
                    "Sending image to OCR service..."
                );


                // ------------------------------------
                // CALL EDGE FUNCTION
                // ------------------------------------

                const response =
                    await fetch(
                        OCR_FUNCTION_URL,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`

                            },

                            body: JSON.stringify({

                                image:
                                    imageBase64,

                                mimeType:
                                    file.type

                            })

                        }
                    );


                // ------------------------------------
                // READ RESPONSE
                // ------------------------------------

                const responseText =
                    await response.text();


                console.log(
                    "OCR FUNCTION RESPONSE:",
                    responseText
                );


                let result;


                try {

                    result =
                        JSON.parse(
                            responseText
                        );

                } catch {

                    throw new Error(
                        "The OCR service returned an invalid response."
                    );

                }


                // ------------------------------------
                // HTTP ERROR
                // ------------------------------------

                if (!response.ok) {

                    console.error(
                        "OCR Edge Function error:",
                        result
                    );


                    throw new Error(
                        result.message ||
                        "Unable to read the registration photo."
                    );

                }


                // ------------------------------------
                // OCR FAILURE
                // ------------------------------------

                if (!result.success) {

                    showOCRStatus(
                        "!",
                        "We couldn't read the form clearly.",
                        result.message ||
                        "Please use a clearer photo or enter the information manually.",
                        "ocr-warning"
                    );

                    return;

                }


                // ------------------------------------
                // EXTRACT DATA
                // ------------------------------------

                const data =
                    result.data || {};


                console.log(
                    "Extracted registration data:",
                    data
                );


                // ------------------------------------
                // SAVE OCR DATA
                // ------------------------------------

                sessionStorage.setItem(
                    "luckyDrawOCRData",
                    JSON.stringify(
                        data
                    )
                );


                // ------------------------------------
                // SUCCESS MESSAGE
                // ------------------------------------

                showOCRStatus(
                    "✓",
                    "Details found!",
                    "We've read the information from your form. Please check everything on the next page.",
                    "ocr-success"
                );


                // ------------------------------------
                // SHOW REVIEW BUTTON
                // ------------------------------------

                if (continueButton) {

                    continueButton.style.display =
                        "block";

                }


            } catch (error) {

                console.error(
                    "OCR ERROR:",
                    error
                );


                showOCRStatus(
                    "!",
                    "Unable to read the photo.",
                    error.message ||
                    "Please use a clear photo and try again.",
                    "ocr-warning"
                );

            }

        }



        // ============================================
        // PHOTO UPLOAD
        // ============================================
        //
        // IMPORTANT:
        //
        // The real input handles the mobile
        // camera/gallery.
        //
        // We intentionally DO NOT use:
        //
        // registrationImage.click()
        //
        // This keeps mobile upload working.
        // ============================================

        if (registrationImage) {

            registrationImage.addEventListener(
                "change",
                async function () {

                    const file =
                        this.files &&
                        this.files.length > 0
                            ? this.files[0]
                            : null;


                    if (!file) {

                        if (selectedFileName) {

                            selectedFileName.innerText =
                                "No file selected";

                        }


                        if (ocrStatus) {

                            ocrStatus.style.display =
                                "none";

                        }


                        if (continueButton) {

                            continueButton.style.display =
                                "none";

                        }

                        return;

                    }


                    // --------------------------------
                    // FILE TYPE
                    // --------------------------------

                    const allowedTypes = [
                        "image/jpeg",
                        "image/jpg",
                        "image/png",
                        "image/webp"
                    ];


                    if (
                        !allowedTypes.includes(
                            file.type
                        )
                    ) {

                        alert(
                            "Please upload a JPG, PNG, or WebP image."
                        );


                        this.value =
                            "";

                        return;

                    }


                    // --------------------------------
                    // FILE SIZE
                    // --------------------------------

                    const MAX_FILE_SIZE =
                        10 * 1024 * 1024;


                    if (
                        file.size >
                        MAX_FILE_SIZE
                    ) {

                        alert(
                            "Image is too large. Maximum size is 10 MB."
                        );


                        this.value =
                            "";

                        return;

                    }


                    // --------------------------------
                    // DISPLAY FILE NAME
                    // --------------------------------

                    if (selectedFileName) {

                        selectedFileName.innerText =
                            file.name;

                    }


                    // --------------------------------
                    // START OCR
                    // --------------------------------

                    await readRegistrationForm(
                        file
                    );

                }
            );

        }



        // ============================================
        // CONTINUE TO REGISTRATION
        // ============================================

        if (continueButton) {

            continueButton.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "index.html";

                }
            );

        }

    </script>

</body>

</html>
