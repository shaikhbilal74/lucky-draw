<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Registration Form - Lucky Draw</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- ================================= -->
    <!-- UPLOAD PAGE UI ONLY -->
    <!-- ================================= -->

    <style>

        /* ================================= */
        /* UPLOAD PAGE LAYOUT */
        /* ================================= */

        .upload-page {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 55px 20px 70px;
            box-sizing: border-box;
        }


        .upload-card {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 22px;
            padding: 38px;
            box-sizing: border-box;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }


        /* ================================= */
        /* HEADER */
        /* ================================= */

        .upload-header {
            text-align: center;
            margin-bottom: 28px;
        }


        .upload-header-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: linear-gradient(
                135deg,
                #fff1f4,
                #fff7ec
            );
        }


        .upload-header h1 {
            margin: 0 0 10px;
            font-size: 32px;
            line-height: 1.2;
            color: #111827;
        }


        .upload-header p {
            margin: 0 auto;
            max-width: 570px;
            font-size: 16px;
            line-height: 1.6;
            color: #64748b;
        }


        /* ================================= */
        /* SMALL INSTRUCTION */
        /* ================================= */

        .upload-tip {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 14px;
            line-height: 1.5;
        }


        .upload-tip-icon {
            flex-shrink: 0;
            font-size: 18px;
        }


        .upload-tip strong {
            display: block;
            margin-bottom: 2px;
            color: #1e293b;
        }


        /* ================================= */
        /* PHOTO UPLOAD BOX */
        /* ================================= */

        .compact-upload {
            width: 100%;
            min-height: 105px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border: 2px dashed #ff6b81;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #fff8f9,
                #fffaf5
            );
            cursor: pointer;
            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .compact-upload:hover {
            border-color: #ff4260;
            background: #fff5f7;
            box-shadow: 0 6px 18px rgba(255, 66, 96, 0.08);
        }


        .compact-upload:active {
            transform: scale(0.995);
        }


        .compact-upload-icon {
            width: 54px;
            height: 54px;
            flex-shrink: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f3;
            font-size: 27px;
        }


        .compact-upload-main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }


        .compact-upload-main strong {
            font-size: 17px;
            color: #0f172a;
        }


        .compact-upload-main span {
            font-size: 14px;
            color: #64748b;
        }


        .selected-file-name {
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #334155;
            font-size: 14px;
            text-align: right;
        }


        /* ================================= */
        /* OCR STATUS */
        /* ================================= */

        .ocr-status {
            width: 100%;
            box-sizing: border-box;
            margin-top: 18px;
            padding: 17px 18px;
            border-radius: 15px;
            display: flex;
            align-items: flex-start;
            gap: 13px;
        }


        .ocr-status-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
        }


        .ocr-status strong {
            display: block;
            margin-bottom: 4px;
            font-size: 16px;
        }


        .ocr-status p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }


        .ocr-loading {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }


        .ocr-loading .ocr-status-icon {
            background: #dbeafe;
        }


        .ocr-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }


        .ocr-success .ocr-status-icon {
            background: #dcfce7;
            color: #15803d;
        }


        .ocr-warning {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
        }


        .ocr-warning .ocr-status-icon {
            background: #ffedd5;
            color: #c2410c;
        }


        /* ================================= */
        /* BUTTONS */
        /* ================================= */

        #continueButton {
            width: 100%;
            margin-top: 22px;
            min-height: 54px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                #ff3b5c,
                #ff7518
            );
            box-shadow: 0 8px 18px rgba(255, 81, 61, 0.18);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        #continueButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(255, 81, 61, 0.25);
        }


        #continueButton:active {
            transform: translateY(0);
        }


        .back-btn {
            width: 100%;
            min-height: 52px;
            margin-top: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }


        /* ================================= */
        /* MOBILE */
        /* ================================= */

        @media (max-width: 600px) {

            .upload-page {
                min-height: calc(100vh - 70px);
                padding: 25px 14px 40px;
            }


            .upload-card {
                padding: 24px 18px;
                border-radius: 18px;
            }


            .upload-header {
                margin-bottom: 22px;
            }


            .upload-header-icon {
                width: 56px;
                height: 56px;
                margin-bottom: 13px;
                font-size: 28px;
                border-radius: 15px;
            }


            .upload-header h1 {
                font-size: 26px;
                line-height: 1.25;
            }


            .upload-header p {
                font-size: 14px;
                line-height: 1.5;
            }


            .upload-tip {
                padding: 12px 13px;
                font-size: 13px;
                margin-bottom: 14px;
            }


            .compact-upload {
                min-height: 92px;
                padding: 14px;
                gap: 12px;
                border-radius: 14px;
            }


            .compact-upload-icon {
                width: 46px;
                height: 46px;
                border-radius: 12px;
                font-size: 23px;
            }


            .compact-upload-main strong {
                font-size: 15px;
            }


            .compact-upload-main span {
                font-size: 12px;
            }


            .selected-file-name {
                max-width: 105px;
                font-size: 12px;
            }


            .ocr-status {
                padding: 14px;
                margin-top: 14px;
                gap: 10px;
            }


            .ocr-status-icon {
                width: 29px;
                height: 29px;
                font-size: 15px;
            }


            .ocr-status strong {
                font-size: 14px;
            }


            .ocr-status p {
                font-size: 12px;
            }


            #continueButton {
                min-height: 50px;
                margin-top: 18px;
                font-size: 15px;
            }


            .back-btn {
                min-height: 48px;
                margin-top: 10px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>

    <!-- ================================= -->
    <!-- NAVBAR -->
    <!-- ================================= -->

    <nav class="navbar">

        <div class="logo">
            🎉 <span>Lucky</span>Draw
        </div>

        <div class="participant-label">
            Registration
        </div>

    </nav>


    <!-- ================================= -->
    <!-- UPLOAD PAGE -->
    <!-- ================================= -->

    <section class="upload-page">

        <div class="upload-card">


            <!-- ================================= -->
            <!-- HEADER -->
            <!-- ================================= -->

            <div class="upload-header">

                <div
                    class="upload-header-icon"
                    aria-hidden="true"
                >
                    📄
                </div>


                <h1>
                    Upload Registration Form
                </h1>


                <p>
                    Upload a photo of your completed registration
                    form and we'll automatically read your details.
                </p>

            </div>


            <!-- ================================= -->
            <!-- HELPFUL TIP -->
            <!-- ================================= -->

            <div class="upload-tip">

                <div
                    class="upload-tip-icon"
                    aria-hidden="true"
                >
                    💡
                </div>

















                
            </div>


            <!-- ================================= -->
            <!-- PHOTO UPLOAD -->
            <!-- ================================= -->

            <label
                for="registrationImage"
                class="compact-upload"
                id="photoUploadButton"
            >

                <div
                    class="compact-upload-icon"
                    aria-hidden="true"
                >
                    ☁️
                </div>


                <div class="compact-upload-main">

                    <strong>
                        Choose Photo
                    </strong>

                    <span>
                        JPG, PNG or other image
                    </span>

                </div>


                <div
                    id="selectedFileName"
                    class="selected-file-name"
                >
                    No file selected
                </div>

            </label>


            <!-- ================================= -->
            <!-- REAL FILE INPUT -->
            <!-- ================================= -->

            <input
                type="file"
                id="registrationImage"
                name="registrationImage"
                accept="image/*"
                style="
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    padding: 0;
                    margin: -1px;
                    overflow: hidden;
                    clip: rect(0, 0, 0, 0);
                    clip-path: inset(50%);
                    white-space: nowrap;
                    border: 0;
                    opacity: 0;
                "
            >


            <!-- ================================= -->
            <!-- OCR STATUS -->
            <!-- ================================= -->

            <div
                id="ocrStatus"
                class="ocr-status"
                style="display: none;"
            >

                <div
                    id="ocrStatusIcon"
                    class="ocr-status-icon"
                >
                    ✓
                </div>


                <div>

                    <strong id="ocrStatusTitle">
                        Reading form...
                    </strong>


                    <p id="ocrStatusText">
                        Please wait while we read your registration form.
                    </p>

                </div>

            </div>


            <!-- ================================= -->
            <!-- CONTINUE BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                id="continueButton"
                class="register-btn"
                style="display: none;"
            >
                Review Your Details
            </button>


            <!-- ================================= -->
            <!-- BACK BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                onclick="window.location.href='index.html'"
                class="back-btn"
            >
                ← Back to Registration
            </button>


        </div>

    </section>


    <!-- ================================= -->
    <!-- SUPABASE -->
    <!-- ================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ================================= -->
    <!-- UPLOAD / OCR JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const SUPABASE_URL =
            "https://mvwaanrbqjozxbncogzf.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_-jVZOnMljZt3VqDkwHCf_g_o8GDU_6c";


        const OCR_FUNCTION_URL =
            `${SUPABASE_URL}/functions/v1/read-registration-form`;


        const registrationImage =
            document.getElementById(
                "registrationImage"
            );


        const selectedFileName =
            document.getElementById(
                "selectedFileName"
            );


        const ocrStatus =
            document.getElementById(
                "ocrStatus"
            );


        const ocrStatusIcon =
            document.getElementById(
                "ocrStatusIcon"
            );


        const ocrStatusTitle =
            document.getElementById(
                "ocrStatusTitle"
            );


        const ocrStatusText =
            document.getElementById(
                "ocrStatusText"
            );


        const continueButton =
            document.getElementById(
                "continueButton"
            );


        function showOCRStatus(
            icon,
            title,
            message,
            statusClass = ""
        ) {

            if (!ocrStatus) {
                return;
            }


            ocrStatus.style.display =
                "flex";


            ocrStatus.className =
                "ocr-status";


            if (statusClass) {

                ocrStatus.classList.add(
                    statusClass
                );

            }


            if (ocrStatusIcon) {

                ocrStatusIcon.innerText =
                    icon;

            }


            if (ocrStatusTitle) {

                ocrStatusTitle.innerText =
                    title;

            }


            if (ocrStatusText) {

                ocrStatusText.innerText =
                    message;

            }

        }


        function fileToBase64(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();


                    reader.onload = () => {

                        resolve(
                            reader.result
                        );

                    };


                    reader.onerror = () => {

                        reject(
                            new Error(
                                "Unable to read image file."
                            )
                        );

                    };


                    reader.readAsDataURL(file);

                }
            );

        }


        async function readRegistrationForm(
            file
        ) {

            try {

                showOCRStatus(
                    "⏳",
                    "Reading form...",
                    "Please wait while we read the registration details.",
                    "ocr-loading"
                );


                if (continueButton) {

                    continueButton.style.display =
                        "none";

                }


                const imageBase64 =
                    await fileToBase64(file);


                const response =
                    await fetch(
                        OCR_FUNCTION_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`
                            },

                            body: JSON.stringify({
                                image:
                                    imageBase64,

                                mimeType:
                                    file.type
                            })
                        }
                    );


                const responseText =
                    await response.text();


                let result;


                try {

                    result =
                        JSON.parse(
                            responseText
                        );

                } catch {

                    throw new Error(
                        "The OCR service returned an invalid response."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to read the registration photo."
                    );

                }


                if (!result.success) {

                    showOCRStatus(
                        "!",
                        "We couldn't read the form clearly.",
                        result.message ||
                        "Please use a clearer photo or enter the information manually.",
                        "ocr-warning"
                    );

                    return;

                }


                const data =
                    result.data || {};


                sessionStorage.setItem(
                    "luckyDrawOCRData",
                    JSON.stringify(data)
                );


                showOCRStatus(
                    "✓",
                    "Details found!",
                    "We've read the information from your form. Please check everything on the next page.",
                    "ocr-success"
                );


                if (continueButton) {

                    continueButton.style.display =
                        "block";

                }


            } catch (error) {

                console.error(
                    "OCR ERROR:",
                    error
                );


                showOCRStatus(
                    "!",
                    "Unable to read the photo.",
                    error.message ||
                    "Please use a clear photo and try again.",
                    "ocr-warning"
                );

            }

        }


        if (registrationImage) {

            registrationImage.addEventListener(
                "change",
                async function () {

                    const file =
                        this.files[0];


                    if (!file) {

                        if (selectedFileName) {

                            selectedFileName.innerText =
                                "No file selected";

                        }

                        if (ocrStatus) {

                            ocrStatus.style.display =
                                "none";

                        }

                        if (continueButton) {

                            continueButton.style.display =
                                "none";

                        }

                        return;

                    }


                    const allowedTypes = [
                        "image/jpeg",
                        "image/png",
                        "image/webp"
                    ];


                    if (
                        !allowedTypes.includes(
                            file.type
                        )
                    ) {

                        alert(
                            "Please upload a JPG, PNG, or WebP image."
                        );

                        this.value =
                            "";

                        return;

                    }


                    const MAX_FILE_SIZE =
                        10 * 1024 * 1024;


                    if (
                        file.size >
                        MAX_FILE_SIZE
                    ) {

                        alert(
                            "Image is too large. Maximum size is 10 MB."
                        );

                        this.value =
                            "";

                        return;

                    }


                    if (selectedFileName) {

                        selectedFileName.innerText =
                            file.name;

                    }


                    await readRegistrationForm(
                        file
                    );

                }
            );

        }


        if (continueButton) {

            continueButton.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "index.html";

                }
            );

        }

    </script>

</body>

</html>
