<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Registration Form - Lucky Draw</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- ================================= -->
    <!-- NAVBAR -->
    <!-- ================================= -->

    <nav class="navbar">

        <div class="logo">
            🎉 <span>Lucky</span>Draw
        </div>

        <div class="participant-label">
            Registration
        </div>

    </nav>


    <!-- ================================= -->
    <!-- UPLOAD PAGE -->
    <!-- ================================= -->

    <section
        class="page active-page"
    >

        <div class="registration-card">

            <div class="form-header">

                <h1>
                    📄 Upload Registration Form
                </h1>

                <p>
                    Upload a photo of your filled registration form
                    and we'll automatically read the details for you.
                </p>

            </div>


            <!-- ================================= -->
            <!-- PHOTO UPLOAD -->
            <!-- ================================= -->

            <div
                class="compact-upload"
                id="photoUploadButton"
                style="
                    position: relative;
                    cursor: pointer;
                    overflow: hidden;
                "
            >

                <div
                    class="compact-upload-icon"
                    aria-hidden="true"
                >
                    ☁️
                </div>


                <div class="compact-upload-main">

                    <strong>
                        Choose Photo
                    </strong>

                    <span>
                        JPG, PNG or other image
                    </span>

                </div>


                <div
                    id="selectedFileName"
                    class="selected-file-name"
                >
                    No file selected
                </div>


                <!-- ================================= -->
                <!-- REAL MOBILE-SAFE FILE INPUT -->
                <!-- ================================= -->

                <input
                    type="file"
                    id="registrationImage"
                    name="registrationImage"
                    accept="image/jpeg,image/png,image/webp"
                    capture="environment"
                    style="
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        opacity: 0;
                        cursor: pointer;
                        z-index: 10;
                        display: block;
                    "
                >

            </div>


            <!-- ================================= -->
            <!-- OCR STATUS -->
            <!-- ================================= -->

            <div
                id="ocrStatus"
                class="ocr-status"
                style="display: none;"
            >

                <div
                    id="ocrStatusIcon"
                    class="ocr-status-icon"
                >
                    ✓
                </div>


                <div>

                    <strong id="ocrStatusTitle">
                        Reading form...
                    </strong>


                    <p id="ocrStatusText">
                        Please wait while we read your registration form.
                    </p>

                </div>

            </div>


            <!-- ================================= -->
            <!-- CONTINUE BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                id="continueButton"
                class="register-btn"
                style="display: none;"
            >
                Continue to Registration
            </button>


            <!-- ================================= -->
            <!-- BACK BUTTON -->
            <!-- ================================= -->

            <button
                type="button"
                onclick="window.location.href='index.html'"
                class="back-btn"
            >
                ← Back to Registration
            </button>

        </div>

    </section>


    <!-- ================================= -->
    <!-- SUPABASE -->
    <!-- ================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ================================= -->
    <!-- UPLOAD / OCR JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const SUPABASE_URL =
            "https://mvwaanrbqjozxbncogzf.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_-jVZOnMljZt3VqDkwHCf_g_o8GDU_6c";


        const OCR_FUNCTION_URL =
            `${SUPABASE_URL}/functions/v1/read-registration-form`;


        const registrationImage =
            document.getElementById(
                "registrationImage"
            );


        const selectedFileName =
            document.getElementById(
                "selectedFileName"
            );


        const ocrStatus =
            document.getElementById(
                "ocrStatus"
            );


        const ocrStatusIcon =
            document.getElementById(
                "ocrStatusIcon"
            );


        const ocrStatusTitle =
            document.getElementById(
                "ocrStatusTitle"
            );


        const ocrStatusText =
            document.getElementById(
                "ocrStatusText"
            );


        const continueButton =
            document.getElementById(
                "continueButton"
            );


        function showOCRStatus(
            icon,
            title,
            message,
            statusClass = ""
        ) {

            if (!ocrStatus) {
                return;
            }


            ocrStatus.style.display =
                "flex";


            ocrStatus.className =
                "ocr-status";


            if (statusClass) {

                ocrStatus.classList.add(
                    statusClass
                );

            }


            if (ocrStatusIcon) {

                ocrStatusIcon.innerText =
                    icon;

            }


            if (ocrStatusTitle) {

                ocrStatusTitle.innerText =
                    title;

            }


            if (ocrStatusText) {

                ocrStatusText.innerText =
                    message;

            }

        }


        function fileToBase64(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();


                    reader.onload = () => {

                        resolve(
                            reader.result
                        );

                    };


                    reader.onerror = () => {

                        reject(
                            new Error(
                                "Unable to read image file."
                            )
                        );

                    };


                    reader.readAsDataURL(file);

                }
            );

        }


        async function readRegistrationForm(
            file
        ) {

            try {

                showOCRStatus(
                    "⏳",
                    "Reading form...",
                    "Please wait while we read the registration details.",
                    "ocr-loading"
                );


                if (continueButton) {

                    continueButton.style.display =
                        "none";

                }


                const imageBase64 =
                    await fileToBase64(file);


                const response =
                    await fetch(
                        OCR_FUNCTION_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${SUPABASE_KEY}`
                            },

                            body: JSON.stringify({
                                image:
                                    imageBase64,

                                mimeType:
                                    file.type
                            })
                        }
                    );


                const responseText =
                    await response.text();


                let result;


                try {

                    result =
                        JSON.parse(
                            responseText
                        );

                } catch {

                    throw new Error(
                        "The OCR service returned an invalid response."
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to read the registration photo."
                    );

                }


                if (!result.success) {

                    showOCRStatus(
                        "!",
                        "We couldn't read the form clearly.",
                        result.message ||
                        "Please use a clearer photo or enter the information manually.",
                        "ocr-warning"
                    );

                    return;

                }


                const data =
                    result.data || {};


                sessionStorage.setItem(
                    "luckyDrawOCRData",
                    JSON.stringify(data)
                );


                showOCRStatus(
                    "✓",
                    "Details found!",
                    "We've read the information from your form. Please check everything on the next page.",
                    "ocr-success"
                );


                if (continueButton) {

                    continueButton.style.display =
                        "block";

                }


            } catch (error) {

                console.error(
                    "OCR ERROR:",
                    error
                );


                showOCRStatus(
                    "!",
                    "Unable to read the photo.",
                    error.message ||
                    "Please use a clear photo and try again.",
                    "ocr-warning"
                );

            }

        }


        if (registrationImage) {

            registrationImage.addEventListener(
                "change",
                async function () {

                    const file =
                        this.files[0];


                    if (!file) {

                        if (selectedFileName) {

                            selectedFileName.innerText =
                                "No file selected";

                        }

                        if (ocrStatus) {

                            ocrStatus.style.display =
                                "none";

                        }

                        if (continueButton) {

                            continueButton.style.display =
                                "none";

                        }

                        return;

                    }


                    const allowedTypes = [
                        "image/jpeg",
                        "image/png",
                        "image/webp"
                    ];


                    if (
                        !allowedTypes.includes(
                            file.type
                        )
                    ) {

                        alert(
                            "Please upload a JPG, PNG, or WebP image."
                        );

                        this.value =
                            "";

                        return;

                    }


                    const MAX_FILE_SIZE =
                        10 * 1024 * 1024;


                    if (
                        file.size >
                        MAX_FILE_SIZE
                    ) {

                        alert(
                            "Image is too large. Maximum size is 10 MB."
                        );

                        this.value =
                            "";

                        return;

                    }


                    if (selectedFileName) {

                        selectedFileName.innerText =
                            file.name;

                    }


                    await readRegistrationForm(
                        file
                    );

                }
            );

        }


        if (continueButton) {

            continueButton.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "index.html";

                }
            );

        }

    </script>

</body>

</html>
